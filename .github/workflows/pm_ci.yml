name: "CI - Push to Main"

on:
  push:
    branches: [main, 'release/**']
    paths-ignore:
      - "**.md"
      - "*.txt"
      - "docs/**"
      - "contrib/**"
      - ".github/**"
      - "!.github/workflows/pm_ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify environment
        run: |
          java -version
          mvn --version
          ffmpeg -version
          
      - name: Create music directory
        run: mkdir -p /tmp/music
      - name: Build and test
        run: mvn clean verify -Dmaven.wagon.http.retryHandler.count=5 -Daether.connector.connectTimeout=300000 -Daether.connector.requestTimeout=300000

      - name: Generate checksums
        run: |
          cd airsonic-main/target
          sha256sum airsonic.war > artifacts-checksums.sha256

      - name: Upload .war artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: airsonic.war
          path: airsonic-main/target/airsonic.war

      - name: Upload checksums artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: artifacts-checksums.sha256
          path: airsonic-main/target/artifacts-checksums.sha256
